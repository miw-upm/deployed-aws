name: CD. Deploy nginx to AWS Lightsail
on:
  push:
    branches:
      - nginx

jobs:
  cd:
    name: Deploy Docker Nginx on AWS Lightsail
    runs-on: ubuntu-22.04

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦Upload Nginx config on AWS Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY }}
          source: "docs/lightsail-nginx.conf,docs/lightsail-renew-letsencrypt.sh"
          target: "/tmp/nginx/"

      - name: 🚀 Deploy Nginx on AWS Lightsail
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            # Colocar config Nginx
            sudo mkdir -p /opt/nginx/conf.d
            sudo mv /tmp/nginx/docs/lightsail-nginx.conf /opt/nginx/conf.d/default.conf
            sudo chmod 644 /opt/nginx/conf.d/default.conf
            
            # Preparar LetsEncrypt dirs (no rompe si no hay SSL aún)
            sudo mkdir -p /opt/letsencrypt/etc /opt/letsencrypt/www

            # Instalar script de renovación + cron (idempotente)
            sudo install -m 755 /tmp/nginx/docs/lightsail-renew-letsencrypt.sh /usr/local/bin/renew-letsencrypt.sh
            if [ ! -f /etc/cron.d/letsencrypt-renew ]; then
              echo "10 3 * * * root /usr/local/bin/renew-letsencrypt.sh" | sudo tee /etc/cron.d/letsencrypt-renew >/dev/null
              sudo chmod 644 /etc/cron.d/letsencrypt-renew
            fi
            
            docker rm -f nginx-gateway || true
            docker run -d \
              --name nginx-gateway \
              --restart always \
              --network betca \
              -p 80:80 \
              -p 443:443 \
              -v /opt/nginx/conf.d:/etc/nginx/conf.d:ro \
              -v /opt/letsencrypt/www:/var/www/certbot \
              -v /opt/letsencrypt/etc:/etc/letsencrypt \
              nginx:alpine

            sleep 20
            docker image prune --filter "until=12h" -f
