# =========================
# HTTP (puerto 80)
# =========================
server {
  listen 80;
  server_name lightsail.miwupm.es;

  # Challenge de Let's Encrypt (HTTP-01)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
    default_type "text/plain";
  }

  # Normalizar /api-1
  location = /api-1 {
    return 301 /api-1/;
  }

  # Redirigir todo a HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# =========================
# HTTPS (puerto 443)
# =========================
server {
  listen 443 ssl;
  http2 on;
  server_name lightsail.miwupm.es;

  # Certificados Let's Encrypt
  ssl_certificate     /etc/letsencrypt/live/lightsail.miwupm.es/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lightsail.miwupm.es/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;

  # Bloquear ejecución/servicio de scripts
  location ~* \.(php|pl|py|sh|cgi|rb)$ {
    return 403;
  }

  # Normalizar /api-1
  location = /api-1 {
    return 301 /api-1/;
  }

  # Proxy hacia el contenedor del API
  location /api-1/ {
    proxy_pass http://deployed-aws:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Endpoint raíz (healthcheck)
  location / {
    return 200 '{"status":"ok","service":"nginx-gateway"}';
    add_header Content-Type application/json;
  }
}
